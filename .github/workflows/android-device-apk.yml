name: Android device-test APK

on:
  pull_request:
    paths:
      - "apps/mobile/**"
      - ".github/workflows/android-device-apk.yml"
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or commit to build
        required: true
        default: feature/rentmate-testing-apk
        type: string

permissions:
  contents: read

concurrency:
  group: android-device-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build installable Android test APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout selected source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK components (compileSdk 37 is required; never downgraded)
        run: |
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null
          # The API 37 platform has been published as both "platforms;android-37" and "platforms;android-37.0";
          # take whichever this runner's SDK catalogue offers instead of guessing, and fail loudly if neither exists.
          "$sdkmanager" --list 2>/dev/null > "$RUNNER_TEMP/sdk-list.txt"
          platform="$(grep -oE 'platforms;android-37(\.[0-9]+)?' "$RUNNER_TEMP/sdk-list.txt" | sort -uV | tail -n 1)"
          build_tools="$(grep -vE -- '-rc[0-9]' "$RUNNER_TEMP/sdk-list.txt" | grep -oE 'build-tools;3[67]\.[0-9]+\.[0-9]+' | sort -uV | tail -n 1)"
          if [ -z "$platform" ] || [ -z "$build_tools" ]; then
            echo "::error::Android API 37 platform or build-tools 36/37 is not available from sdkmanager on this runner."
            grep -E 'platforms;android-3[67]|build-tools;3[67]' "$RUNNER_TEMP/sdk-list.txt" | sort -u | head -20
            exit 1
          fi
          echo "Installing $platform and $build_tools"
          "$sdkmanager" "platform-tools" "$platform" "$build_tools"
          ls "$ANDROID_HOME/platforms"

      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: npm ci

      - name: Validate public app configuration
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
        run: |
          missing=0
          for name in EXPO_PUBLIC_SUPABASE_URL EXPO_PUBLIC_SUPABASE_ANON_KEY EXPO_PUBLIC_API_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository Actions variable $name is missing."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Add the three public client configuration values under Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi
          node -e 'new URL(process.env.EXPO_PUBLIC_SUPABASE_URL); new URL(process.env.EXPO_PUBLIC_API_URL);'

      - name: Expo prebuild
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
        run: npx expo prebuild --platform android --no-install

      - name: Verify generated Android package
        working-directory: apps/mobile
        run: |
          test -f android/app/src/main/AndroidManifest.xml
          grep -q 'com.shivaayetechnologies.rentmate' android/app/build.gradle

      # The release variant embeds the JavaScript bundle, so the APK runs on a phone without a Metro dev server, and
      # it leaves out the debug-only manifest that re-adds SYSTEM_ALERT_WINDOW for the developer menu. Expo's
      # generated build signs it with the debug keystore: installable on test phones, not uploadable to Play (P-5).
      - name: Assemble test APK (release variant, debug-signed)
        working-directory: apps/mobile/android
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Verify permissions in the packaged APK
        working-directory: apps/mobile
        run: |
          apk="android/app/build/outputs/apk/release/app-release.apk"
          aapt="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$aapt"
          permissions="$("$aapt" dump permissions "$apk")"
          printf '%s\n' "$permissions"
          if printf '%s\n' "$permissions" | grep -Eq 'ACCESS_FINE_LOCATION|ACCESS_COARSE_LOCATION|ACCESS_BACKGROUND_LOCATION|READ_CONTACTS|SYSTEM_ALERT_WINDOW'; then
            echo "::error::A blocked permission is present in the packaged APK."
            exit 1
          fi
          # Google Play Billing (expo-iap) must be linked: its library adds this permission.
          if ! printf '%s\n' "$permissions" | grep -q 'com.android.vending.BILLING'; then
            echo "::error::Google Play Billing is not linked into the APK."
            exit 1
          fi

      - name: Verify package id and record checksum
        working-directory: apps/mobile
        run: |
          apk="android/app/build/outputs/apk/release/app-release.apk"
          aapt="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          "$aapt" dump badging "$apk" | head -3
          "$aapt" dump badging "$apk" | grep -q "package: name='com.shivaayetechnologies.rentmate'"
          # A tester's APK must carry its own JavaScript bundle and must not be debuggable.
          unzip -l "$apk" | grep -q 'assets/index.android.bundle'
          if "$aapt" dump badging "$apk" | grep -q 'application-debuggable'; then
            echo "::error::The test APK is debuggable."
            exit 1
          fi
          sha256sum "$apk" | sed 's#android/app/build/outputs/apk/release/##' > apk-checksums.txt
          cat apk-checksums.txt

      - name: Upload installable test APK
        uses: actions/upload-artifact@v6
        with:
          name: rentmate-android-internal-test-${{ github.run_number }}
          path: |
            apps/mobile/android/app/build/outputs/apk/release/app-release.apk
            apps/mobile/apk-checksums.txt
          if-no-files-found: error
          retention-days: 7
