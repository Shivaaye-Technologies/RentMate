name: Android device-test APK

on:
  pull_request:
    branches: [feature/android-livekit-calls-streaming]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/android-device-apk.yml"
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or commit to build (use fix/android-call-reliability)
        required: true
        default: fix/android-call-reliability
        type: string

permissions:
  contents: read

concurrency:
  group: android-device-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build installable Android debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout selected source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The deprecated SDK package named "tools" is no longer published.
          tools: ""
          packages: "platform-tools;platforms;android-37;build-tools;36.0.0"

      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: npm ci

      - name: Validate public app configuration
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
        run: |
          missing=0
          for name in EXPO_PUBLIC_SUPABASE_URL EXPO_PUBLIC_SUPABASE_ANON_KEY EXPO_PUBLIC_API_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository Actions variable $name is missing."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Add the three public client configuration values under Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi
          node -e 'new URL(process.env.EXPO_PUBLIC_SUPABASE_URL); new URL(process.env.EXPO_PUBLIC_API_URL);'

      - name: Expo prebuild
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
        run: npx expo prebuild --platform android --no-install

      - name: Verify generated Android package
        working-directory: apps/mobile
        run: |
          test -f android/app/src/main/AndroidManifest.xml
          grep -q 'com.shivaayetechnologies.rentmate' android/app/build.gradle

      - name: Assemble debug APK
        working-directory: apps/mobile/android
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Verify permissions in the packaged APK
        working-directory: apps/mobile
        run: |
          apk="android/app/build/outputs/apk/debug/app-debug.apk"
          aapt="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$aapt"
          permissions="$("$aapt" dump permissions "$apk")"
          printf '%s\\n' "$permissions"
          if printf '%s\\n' "$permissions" | grep -Eq 'ACCESS_FINE_LOCATION|ACCESS_COARSE_LOCATION|ACCESS_BACKGROUND_LOCATION|READ_CONTACTS|SYSTEM_ALERT_WINDOW'; then
            echo "::error::A blocked permission is present in the packaged APK."
            exit 1
          fi

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v6
        with:
          name: rentmate-android-device-test
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
