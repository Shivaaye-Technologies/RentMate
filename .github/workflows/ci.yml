name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Pinned so a runner-image change cannot silently alter the toolchain.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Repository policy (GitHub terms, no secrets, no media, no adult content)
        run: npm run test:policy
      - name: Format
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Migration rollback rehearsal
        run: npm run test:rollback
      - name: Hook guard tests
        run: npm run test:hooks
      - name: aihub tests
        run: npm run test:aihub
      - name: Build
        run: npm run build
      - name: Secret scan (committed .env files)
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example$'; then
            echo "::error::.env file committed"; exit 1
          fi
      - name: Dependency audit (high and critical)
        run: npm audit --omit=dev --audit-level=high

  browser:
    # Real Chromium against a production build of apps/web. All non-local requests are blocked.
    # Pinned to ubuntu-24.04: Playwright's `install --with-deps` only knows the system packages of the Ubuntu
    # releases it supports, so a moving `ubuntu-latest` can break the browser install.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright (not a project dependency)
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Browser smoke tests
        run: npm run test:e2e

  db-concurrency:
    # Real PostgreSQL with two simultaneous sessions: double-booking, idempotent retries, cancel-vs-accept.
    # PGlite (npm run test:db, in the check job) has one connection and cannot test these races.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          # Throwaway container that exists only for this job; not a real credential.
          POSTGRES_PASSWORD: ci-throwaway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - name: Booking concurrency tests
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: ci-throwaway
        run: scripts/test-db-concurrency.sh
