name: Temporary Prettier repair
on:
  push:
    branches:
      - feature/payment-platform-foundation
      - feature/android-wallet-ledger-screen
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Format changed feature files
        run: |
          if [ "${{ github.ref_name }}" = "feature/payment-platform-foundation" ]; then
            npx prettier --write docs/PLAY_BILLING_IMPLEMENTATION.md
          else
            npx prettier --write 'apps/mobile/app/(app)/wallet.tsx'
          fi
      - name: Commit formatting
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/PLAY_BILLING_IMPLEMENTATION.md 'apps/mobile/app/(app)/wallet.tsx'
            git commit -m "style: apply repository Prettier formatting"
            git push
          fi
