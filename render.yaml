# Render Blueprint. Secrets use sync: false, so you enter them in the Render
# dashboard; they are never stored in this file.
services:
  - type: web
    name: soulmate-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run build -w apps/api
    startCommand: npm start -w apps/api
    healthCheckPath: /health
    # Deploy only reviewed code. Without this, Render deploys the repository's default branch, which on GitHub is
    # currently the feature branch.
    branch: main
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: CORS_ORIGINS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      # SOULMATE LIVE: set only after the provider's terms are approved.
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      # Webhooks and room removal; same value stored once with private.set_integration_secret (see .env.example).
      - key: LIVE_WEBHOOK_DB_SECRET
        sync: false
      - key: LIVE_COUNTRY_HEADER
        sync: false

  - type: web
    name: soulmate-web
    runtime: static
    buildCommand: npm ci --include=dev && npm run build -w apps/web
    staticPublishPath: apps/web/dist
    branch: main
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      # Publishable (anon) key: safe in the browser, RLS protects the data.
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    # Browser security headers (OPS-01). Tested: scripts/e2e-smoke.mjs and scripts/e2e-rtc.mjs serve the app with
    # exactly these headers (adding only their local test origins) and fail on any Content-Security-Policy violation;
    # scripts/lib/render-headers.mjs checks the inline theme script's hash. If the API, Supabase or LiveKit moves to a
    # custom domain, add it to connect-src.
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'sha256-cCSMcpX7ZBezEErTPKWaJqDfIBGipTaIqcD2BywMsHU='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.supabase.co; media-src 'self' blob: mediastream:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://*.onrender.com https://*.livekit.cloud wss://*.livekit.cloud; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: "camera=(self), microphone=(self), display-capture=(), geolocation=(), payment=(), usb=()"
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
