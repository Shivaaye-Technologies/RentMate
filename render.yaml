# Render Blueprint. Secrets use sync: false, so you enter them in the Render
# dashboard; they are never stored in this file.
services:
  - type: web
    name: soulmate-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run build -w apps/api
    startCommand: npm start -w apps/api
    healthCheckPath: /health
    # Deploy only reviewed code. Without this, Render deploys the repository's default branch, which on GitHub is
    # currently the feature branch.
    branch: main
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: CORS_ORIGINS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      # SOULMATE LIVE: set only after the provider's terms are approved.
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: LIVE_COUNTRY_HEADER
        sync: false

  - type: web
    name: soulmate-web
    runtime: static
    buildCommand: npm ci --include=dev && npm run build -w apps/web
    staticPublishPath: apps/web/dist
    branch: main
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      # Publishable (anon) key: safe in the browser, RLS protects the data.
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
