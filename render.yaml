# Render Blueprint. Secrets use sync: false, so you enter them in the Render
# dashboard; they are never stored in this file.
services:
  - type: web
    name: soulmate-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run build -w apps/api
    startCommand: npm start -w apps/api
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: CORS_ORIGINS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false

  - type: web
    name: soulmate-web
    runtime: static
    buildCommand: npm ci --include=dev && npm run build -w apps/web
    staticPublishPath: apps/web/dist
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
